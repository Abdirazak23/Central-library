name: Release Library

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on semantic version tags (e.g., v1.0.0, v2.1.3)

jobs:
  release:
    name: Build & Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Required to create GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so release notes can be generated

      # OPTIONAL: Add your language build/test step here before releasing
      # - name: Run Tests
      #   run: npm test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true # Automatically generates changelog from PRs/commits
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}